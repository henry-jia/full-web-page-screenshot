<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="editor_title"></title>
    <link rel="stylesheet" href="editor.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="tool-group" role="group" id="tool-group">
        <button type="button" class="tool-button" data-tool="text" data-i18n="tool_text"></button>
        <button type="button" class="tool-button" data-tool="rect" data-i18n="tool_rect"></button>
        <button type="button" class="tool-button" data-tool="ellipse" data-i18n="tool_ellipse"></button>
        <button type="button" class="tool-button" data-tool="line" data-i18n="tool_line"></button>
        <button type="button" class="tool-button" data-tool="arrow" data-i18n="tool_arrow"></button>
        <button type="button" class="tool-button" data-tool="mosaic" data-i18n="tool_mosaic"></button>
        <button type="button" class="tool-button" data-tool="badge" data-i18n="tool_badge"></button>
      </div>

      <div class="tool-group" role="group" id="color-group" aria-label="color">
        <button type="button" class="color-swatch" data-color="#e5484d" style="background:#e5484d"></button>
        <button type="button" class="color-swatch" data-color="#f5a623" style="background:#f5a623"></button>
        <button type="button" class="color-swatch" data-color="#3e9bff" style="background:#3e9bff"></button>
        <button type="button" class="color-swatch" data-color="#34c77b" style="background:#34c77b"></button>
        <button type="button" class="color-swatch" data-color="#ffffff" style="background:#ffffff"></button>
        <button type="button" class="color-swatch" data-color="#000000" style="background:#000000"></button>
      </div>

      <div class="tool-group" role="group" id="size-group" aria-label="size">
        <button type="button" class="size-button" data-linewidth="3">S</button>
        <button type="button" class="size-button" data-linewidth="6">M</button>
        <button type="button" class="size-button" data-linewidth="12">L</button>
      </div>

      <div class="tool-group" role="group" aria-label="zoom">
        <button type="button" id="zoom-out" data-i18n="editor_zoom_out"></button>
        <span id="zoom-level" class="zoom-level">100%</span>
        <button type="button" id="zoom-in" data-i18n="editor_zoom_in"></button>
        <button type="button" id="zoom-fit" data-i18n="editor_zoom_fit"></button>
      </div>

      <div class="tool-group">
        <button type="button" id="undo-button" data-i18n="editor_undo"></button>
        <button type="button" id="redo-button" data-i18n="editor_redo"></button>
        <button type="button" id="save-button" class="primary" data-i18n="editor_save"></button>
      </div>
    </header>

    <p class="hint" data-i18n="editor_hint"></p>

    <main id="canvas-wrap" class="canvas-wrap">
      <canvas id="base-canvas"></canvas>
      <canvas id="overlay-canvas"></canvas>
      <div id="text-style-bar" class="text-style-bar" hidden>
        <select id="text-font-select" aria-label="font">
          <option value="system-ui, sans-serif">Sans</option>
          <option value="serif">Serif</option>
          <option value="monospace">Mono</option>
        </select>
        <div class="tool-group" role="group" id="text-size-group" aria-label="text size">
          <button type="button" class="size-button" data-textsize="24">S</button>
          <button type="button" class="size-button" data-textsize="40">M</button>
          <button type="button" class="size-button" data-textsize="72">L</button>
        </div>
        <div class="tool-group" role="group" id="text-color-group" aria-label="text color">
          <button type="button" class="color-swatch" data-color="#e5484d" style="background:#e5484d"></button>
          <button type="button" class="color-swatch" data-color="#f5a623" style="background:#f5a623"></button>
          <button type="button" class="color-swatch" data-color="#3e9bff" style="background:#3e9bff"></button>
          <button type="button" class="color-swatch" data-color="#34c77b" style="background:#34c77b"></button>
          <button type="button" class="color-swatch" data-color="#ffffff" style="background:#ffffff"></button>
          <button type="button" class="color-swatch" data-color="#000000" style="background:#000000"></button>
        </div>
        <div class="tool-group" role="group" id="text-bg-group" aria-label="background color">
          <button type="button" class="color-swatch bg-none" data-bgcolor="" data-i18n-title="editor_bg_none">∅</button>
          <button type="button" class="color-swatch" data-bgcolor="#e5484d" style="background:#e5484d"></button>
          <button type="button" class="color-swatch" data-bgcolor="#f5a623" style="background:#f5a623"></button>
          <button type="button" class="color-swatch" data-bgcolor="#3e9bff" style="background:#3e9bff"></button>
          <button type="button" class="color-swatch" data-bgcolor="#34c77b" style="background:#34c77b"></button>
          <button type="button" class="color-swatch" data-bgcolor="#ffffff" style="background:#ffffff"></button>
          <button type="button" class="color-swatch" data-bgcolor="#000000" style="background:#000000"></button>
        </div>
        <label class="alpha-control">
          <span data-i18n="editor_opacity"></span>
          <input type="range" id="text-alpha" min="10" max="100" step="5" value="40">
        </label>
      </div>
    </main>

    <footer class="status-bar">
      <span id="editor-status"></span>
      <span id="saved-path" class="saved-path"></span>
    </footer>

    <script src="../i18n.js"></script>
    <script src="../annotate.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
