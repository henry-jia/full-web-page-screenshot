<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="popup_title"></title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="capture-panel">
      <header class="capture-header">
        <p class="eyebrow">FULL PAGE / LOCAL</p>
        <h1 data-i18n="popup_title"></h1>
        <p class="intro" data-i18n="popup_intro"></p>
      </header>

      <button id="capture-button" class="capture-button" type="button" data-i18n="button_capture_full">
      </button>

      <button id="region-button" class="capture-button capture-button-secondary" type="button" data-i18n="button_capture_region">
      </button>

      <section id="status-panel" class="status-panel" aria-live="polite">
        <div class="status-heading">
          <span id="status-label"></span>
          <span id="segment-count" class="segment-count">0 / 0</span>
        </div>
        <p id="status-message" data-i18n="capture_idle_message"></p>
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label=""
          data-i18n-aria-label="progress_aria_label"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          hidden
        >
          <span id="progress-fill" class="progress-fill"></span>
        </div>
      </section>

      <figure id="result-preview" class="result-preview" hidden>
        <img id="result-thumbnail" data-i18n-alt="result_thumbnail_alt" alt="">
        <figcaption data-i18n="popup_open_editor_hint"></figcaption>
      </figure>

      <p class="privacy-note" data-i18n="privacy_note"></p>
    </main>
    <script src="../i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
